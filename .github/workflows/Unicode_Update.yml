name: Unicode Emoji Auto Update

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at 00:00 UTC
  workflow_dispatch:      # Allow manual runs
  push:
    paths:
      - Unicode.py        # Re-run if this file changes

permissions:
  contents: write  # IMPORTANT: Allows the workflow to push changes

jobs:
  update_unicode:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 📥 Install dependencies
        run: pip install requests

      - name: 🛠 Run Unicode update script
        run: python Unicode.py

      - name: 🔍 Check for changes
        id: check_changes
        run: |
          git diff --quiet Unicode.html README.md || echo "changes=true" >> $GITHUB_OUTPUT

      - name: 💾 Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Unicode.html README.md
          git commit -m "🔄 Auto-update Unicode emoji list [skip ci]"
          git push
