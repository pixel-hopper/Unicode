
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicode Emoji List</title>
    
    <!-- Favicon (Base64 encoded SVG with emoji) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,CjxzdmcgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIiB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIHZpZXdCb3g9IjAgMCA2NCA2NCI+CiAgPHRleHQgeD0iMCIgeT0iNTAiIGZvbnQtc2l6ZT0iNTAiIGZvbnQtZmFtaWx5PSJBcmlhbCwgc2Fucy1zZXJpZiI+8J+RvTwvdGV4dD4KPC9zdmc+Cg==">
    
    <style>
        :root {
            --bg-color: #f4f4f4;
            --text-color: #333;
            --header-bg: #f2f2f2;
            --border-color: #ddd;
            --hover-color: #eee;
            --input-bg: #fff;
            --input-border: #ccc;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1e1e1e;
                --text-color: #e0e0e0;
                --header-bg: #2d2d2d;
                --border-color: #444;
                --hover-color: #3a3a3a;
                --input-bg: #2d2d2d;
                --input-border: #555;
            }
        }

        body {
            font-family: sans-serif; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        h1 { text-align: center; font-size: 2em; margin-bottom: 20px; color: var(--text-color); }
        input[type="text"] {
            width: 100%;
            max-width: 600px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 1.2em;
            border: 2px solid var(--input-border);
            border-radius: 5px;
            box-sizing: border-box;
            background-color: var(--input-bg);
            color: var(--text-color);
        }
        table {
            width: 100%;
            max-width: 1000px;
            border-collapse: collapse;
            box-sizing: border-box;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border: 1px solid var(--border-color);
        }
        th {
            background-color: var(--header-bg);
            font-weight: bold;
        }
        td.emoji {
            font-size: 1.5em;
        }
        tr.hidden {
            display: none;
        }
        .copy-btn {
            padding: 4px 8px;
            font-size: 0.9em;
            cursor: pointer;
            background-color: var(--hover-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
        }
        .copy-btn:hover {
            background-color: var(--border-color);
        }
        @media (max-width: 600px) {
            h1 { font-size: 1.6em; }
            table { font-size: 0.9em; width: 90%; }
            input[type="text"] { font-size: 1em; padding: 10px; }
        }
    </style>
</head>
<body>
    <h1>Unicode Emoji List</h1>
    <input type="text" id="searchInput" placeholder="Search emojis...">
    <table id="emojiTable">
        <thead>
            <tr><th>Emoji</th><th>Codepoints</th><th>Description</th><th>Copy</th></tr>
        </thead>
        <tbody>

        </tbody>
    </table>
    <script>
        const input = document.getElementById('searchInput');
        const rows = Array.from(document.querySelectorAll('#emojiTable tbody tr'));

        function debounce(func, delay) {
            let timer;
            return function() {
                clearTimeout(timer);
                timer = setTimeout(() => func.apply(this, arguments), delay);
            };
        }

        const filterRows = debounce(function() {
            const filter = input.value.toLowerCase();
            rows.forEach(row => {
                const haystack = row.dataset.search;
                row.classList.toggle('hidden', !haystack.includes(filter));
            });
        }, 100);

        input.addEventListener('input', filterRows);

        function copyToClipboard(event, text) {
            navigator.clipboard.writeText(text).then(() => {
                const btns = document.querySelectorAll('.copy-btn');
                btns.forEach(btn => {
                    if (btn.innerText === 'Copied!') btn.innerText = 'Copy';
                });
                const button = event.target;
                if (button) {
                    button.innerText = 'Copied!';
                    setTimeout(() => button.innerText = 'Copy', 1200);
                }
            }).catch(err => {
                alert('Failed to copy: ' + err);
            });
        }
    </script>
</body>
</html>
